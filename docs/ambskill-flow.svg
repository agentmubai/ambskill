<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">ambskill 两套工具</title>
  <desc id="desc">课和访谈走北冥，做 IP 分身。同形态作品走庖丁，拆解内容。北冥判断辅导，庖丁拆解干活。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 1.8px; fill: #2563EB; }
      .title { font-size: 34px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-size: 17px; fill: #64748B; }
      .index { font-size: 13px; font-weight: 700; fill: #94A3B8; }
      .index-inv { font-size: 13px; font-weight: 700; fill: #BFDBFE; }
      .label { font-size: 20px; font-weight: 700; fill: #0F172A; }
      .label-inv { font-size: 20px; font-weight: 700; fill: #FFFFFF; }
      .body { font-size: 15px; fill: #64748B; }
      .body-inv { font-size: 15px; fill: #DBEAFE; }
      .node { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .node-strong { fill: #2563EB; stroke: #2563EB; }
      .line { fill: none; stroke: #2563EB; stroke-width: 2.5; stroke-linecap: round; marker-end: url(#arrow); }
      .footer { font-size: 15px; font-weight: 600; fill: #334155; }
    </style>
  </defs>
  <rect width="1280" height="520" fill="#FFFFFF"/>
  <rect x="48" y="36" width="6" height="28" rx="2" fill="#2563EB"/>
  <text class="eyebrow" x="68" y="57">AMBSKILL · 两套工具</text>
  <text class="title" x="48" y="108">北冥判断辅导，庖丁拆解干活</text>
  <text class="subtitle" x="48" y="138">课和访谈走北冥。朋友圈、口播、直播稿、文章走庖丁。</text>

  <g transform="translate(48,176)">
    <rect class="node" width="280" height="112" rx="16"/>
    <text class="index" x="20" y="32">喂</text>
    <text class="label" x="20" y="62">课程、访谈</text>
    <text class="body" x="20" y="88">方法论在里面</text>
  </g>
  <g transform="translate(388,176)">
    <rect class="node-strong" width="280" height="112" rx="16"/>
    <text class="index-inv" x="20" y="32">北冥</text>
    <text class="label-inv" x="20" y="62">做 IP 分身</text>
    <text class="body-inv" x="20" y="88">用来判断、辅导</text>
  </g>
  <g transform="translate(728,176)">
    <rect class="node" width="504" height="112" rx="16"/>
    <text class="index" x="20" y="32">拿走</text>
    <text class="label" x="20" y="62">一组任务技能 + 路由器</text>
    <text class="body" x="20" y="88">引文逐字可溯源。只有文案、没有课，别走这里。</text>
  </g>
  <path class="line" d="M328,232 H388"/>
  <path class="line" d="M668,232 H728"/>

  <g transform="translate(48,324)">
    <rect class="node" width="280" height="112" rx="16"/>
    <text class="index" x="20" y="32">喂</text>
    <text class="label" x="20" y="62">朋友圈、口播</text>
    <text class="label" x="20" y="88">直播稿、文章</text>
  </g>
  <g transform="translate(388,324)">
    <rect class="node-strong" width="280" height="112" rx="16"/>
    <text class="index-inv" x="20" y="32">庖丁</text>
    <text class="label-inv" x="20" y="62">拆解内容</text>
    <text class="body-inv" x="20" y="88">用来干活、落地</text>
  </g>
  <g transform="translate(728,324)">
    <rect class="node" width="504" height="112" rx="16"/>
    <text class="index" x="20" y="32">拿走</text>
    <text class="label" x="20" y="62">每类一个能干活的技能 + 路由器</text>
    <text class="body" x="20" y="88">事实是你的。要把课炼成判断，去北冥。</text>
  </g>
  <path class="line" d="M328,380 H388"/>
  <path class="line" d="M668,380 H728"/>

  <text class="footer" x="48" y="480">装哪套用哪套。一次只炼一条线。</text>
</svg>
